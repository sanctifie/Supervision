# ============================================================================
# Supervision Officina — à côté d'Officina, sur le même serveur.
#
# Elle rejoint le réseau Docker d'Officina pour lire Prometheus, Alertmanager
# et Loki par leur nom (installés par supervision/docker-compose.supervision.yml
# du dépôt Pharmatech). Rien n'est modifié côté Officina.
#
#   bash deploy/installer.sh  # serveur neuf : installe aussi Prometheus, Loki…
#   (ou : cp .env.exemple .env, puis docker compose up -d --build, si Officina
#   a déjà sa supervision Pharmatech)
#
# L'interface écoute sur 127.0.0.1:8080 : on l'ouvre par un tunnel SSH
#   ssh -L 8080:127.0.0.1:8080 utilisateur@serveur   puis http://localhost:8080
# ou on la publie derrière Caddy (voir le README).
# ============================================================================
services:
  supervision:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      ALERTMANAGER_URL: ${ALERTMANAGER_URL:-http://alertmanager:9093}
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
    ports:
      - '127.0.0.1:${PORT_PUBLIE:-8080}:8080'
    volumes:
      - donnees:/donnees
      # Rapports déposés par les outils (Trivy de deploy/, Lynis, AIDE) : TRIVY_RAPPORT, LYNIS_RAPPORT, AIDE_RAPPORT.
      - rapports:/donnees/rapports
    networks:
      - officina
    mem_limit: 192m
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

networks:
  # Réseau par défaut du projet Officina : « <dossier>_default ».
  # Officina installée dans /opt/officine-os → officine-os_default.
  officina:
    external: true
    name: ${RESEAU_OFFICINA:-officine-os_default}

volumes:
  donnees:
  # Même volume que le conteneur trivy de deploy/docker-compose.outils.yml.
  rapports:
    name: supervision_rapports
